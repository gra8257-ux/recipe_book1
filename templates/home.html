
{% extends "base.html" %}

{% block content %}

<div class="text-center">

    <!-- Красный баннер на главной странице -->
    <div class="hero-image">
        <img src="{{ url_for('static', filename='cinnabons/hero1.png') }}"
             alt="Книга рецептов">
    </div>

    <!-- Каталог рецептов -->
    <div class="recipe-grid">

        {% for recipe in recipes %}

        <div class="recipe-item">

            <!-- Красная карточка с фотографией -->
            <a href="{{ url_for('recipe_detail', recipe_id=recipe.id) }}"
               class="recipe-card">

                {% if recipe.image %}
                    <img src="{{ url_for('static', filename=recipe.image) }}"
                         alt="{{ recipe.title }}">
                {% endif %}

            </a>

            <!-- Название под карточкой -->
            <h3 class="recipe-name">{{ recipe.title }}</h3>

        </div>

        {% else %}

        <p>Пока рецептов нет</p>

        {% endfor %}

    </div>

    <!-- Кнопки -->
    <div class="buttons">

        <a href="{{ url_for('register') }}" class="primary">
            Зарегистрироваться
        </a>

        <a href="{{ url_for('add_recipe') }}" class="primary">
            Добавить рецепт
        </a>

    </div>

</div>

{% endblock %}
